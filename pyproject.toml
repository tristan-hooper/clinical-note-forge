[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "clinicalnoteforge"
version = "2.0.0"
description = "Auditable synthetic EHR to grounded annotated clinical-note datasets"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["pydantic>=2.7,<3", "typer>=0.12,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1", "build>=1.2,<2"]

[project.scripts]
clinicalnoteforge = "clinicalnoteforge.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
